<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bubu & Dudu 💖</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="game">
    <h2 id="hint">Ayuda a Bubu a llegar con Dudu</h2>
    <p id="status">♥♥♥♥ ♥♥♥♥</p>
    <img id="bubu" class="character" src="bubu.png" alt="Bubu">
    <img id="dudu" class="character" src="dudu.png" alt="Dudu">

    <!-- Diálogos -->
    <div id="dialog-bubu" class="dialog dialog-bubu">
        <p>Duducito te traje esta carta para ti 💕</p>
    </div>

    <div id="dialog-bubu2" class="dialog dialog-bubu">
        <p>¡Ábrela!</p>
    </div>

    <div id="dialog-dudu" class="dialog dialog-dudu">
        <p>Ok, mi Bubucita 💕</p>
    </div>


    <!-- Icono de Carta Clickeable -->
    <div id="letter-icon" class="letter-icon">
        <svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
            <!-- Sobre -->
            <rect x="20" y="40" width="160" height="110" fill="#fff" stroke="#666" stroke-width="3" rx="3"/>
            <!-- Línea de cierre -->
            <line x1="20" y1="40" x2="100" y2="85" stroke="#666" stroke-width="3"/>
            <line x1="180" y1="40" x2="100" y2="85" stroke="#666" stroke-width="3"/>
            <!-- Corazón -->
            <path d="M100,95 C85,85 75,75 75,65 C75,58 80,52 87,52 C92,52 97,56 100,62 C103,56 108,52 113,52 C120,52 125,58 125,65 C125,75 115,85 100,95 Z" 
                fill="#ff1493" stroke="none"/>
        </svg>
    </div>

    <div id="letter">
        <h2>Feliz San Valentín ♥</h2>
        <p>
            Como Bubu siempre busca a Dudu,<br>
            yo siempre voy a buscarte a ti ♥<br><br>
            Gracias por hacerme reír,<br>
            cuidarme y ser mi lugar seguro.
        </p>

        <div class="big-heart">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#ff69b4;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#ff1493;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <path d="M50,85 C20,70 5,55 5,40 C5,25 15,15 25,15 C35,15 45,25 50,35 C55,25 65,15 75,15 C85,15 95,25 95,40 C95,55 80,70 50,85 Z" 
                    fill="url(#heartGradient)" stroke="none"/>
                <path d="M50,85 C20,70 5,55 5,40 C5,25 15,15 25,15 C35,15 45,25 50,35 C55,25 65,15 75,15 C85,15 95,25 95,40 C95,55 80,70 50,85 Z" 
                    fill="none" stroke="#ff0080" stroke-width="1.5" opacity="0.4"/>
            </svg>
        </div>

        <p>
            <strong>Te amo</strong><br>
            Con todo mi corazón<br>
            Cinthya💕
        </p>

        <button id="backBtn">⬅ Volver</button>
    </div>

    
</div>

<audio id="music" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script src="java.js"></script>
</body>
</html>
